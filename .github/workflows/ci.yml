name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ставит инструменты из mise.toml
      # https://github.com/jdx/mise-action
      - uses: jdx/mise-action@v5
      # Коллекции из Galaxy кэшируются, чтобы сбой galaxy.ansible.com не ронял каждый прогон
      # https://github.com/actions/cache
      - uses: actions/cache@v6
        with:
          path: tmp/ansible-collections
          key: ansible-collections-${{ hashFiles('cm/requirements.yml') }}
      - name: Install collections and hooks
        run: make install
      - name: Run checks
        run: mise exec -- hk check --all
